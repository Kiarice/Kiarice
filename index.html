<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>کیارایس | سامانه مدیریت فروش برنج</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

:root{
  --gold:#e0b94a;
  --gold-bright:#f3d47a;
  --bg:#0c0c0e;
  --bg-panel:#151518;
  --bg-card:#1b1b1f;
  --bg-card-hover:#212126;
  --border:#2a2a2f;
  --text:#f2f0ea;
  --text-dim:#a8a6a0;
  --text-faint:#706e6a;
  --green:#3ddc84;
  --red:#e05353;
  --blue:#3b9dfd;
  --radius:14px;
  --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Vazirmatn',sans-serif;
  direction:rtl;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:#111}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

.hidden{display:none !important}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 40%, #17140a 0%, #0c0c0e 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999;
  animation:splashOut .6s ease 2.4s forwards;
}
#splash img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 0 25px rgba(224,185,74,.35));animation:pulse 2.2s ease-in-out infinite}
#splash .brand{font-size:26px;letter-spacing:3px;color:var(--gold-bright);font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 20%, #1a1710 0%, #0c0c0e 60%);
}
.login-card{
  width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:34px 28px;box-shadow:var(--shadow);text-align:center;
  animation:fadeUp .5s ease;
}
.login-card img{width:76px;margin-bottom:10px}
.login-card h1{font-size:19px;margin:6px 0 2px;color:var(--gold-bright)}
.login-card p.sub{color:var(--text-dim);font-size:13px;margin:0 0 22px}
.field{text-align:right;margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:#101012;border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:10px;font-size:14px;outline:none;transition:.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--gold);color:#141105;border:none;padding:12px 18px;border-radius:10px;
  font-weight:700;font-size:14px;cursor:pointer;transition:.2s;
}
.btn:hover{background:var(--gold-bright);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#f16b6b}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
.login-version{margin-top:18px;font-size:11px;color:var(--text-faint)}
.login-error{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ---------- App shell ---------- */
#app{display:none;min-height:100vh}
#app.show{display:flex}

.sidebar{
  width:250px;flex-shrink:0;background:var(--bg-panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:6px 6px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sidebar .brand-row img{width:38px;height:38px;object-fit:contain}
.sidebar .brand-row div b{display:block;font-size:14px;color:var(--gold-bright)}
.sidebar .brand-row div span{display:block;font-size:11px;color:var(--text-dim)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;
  color:var(--text-dim);font-size:13.5px;margin-bottom:3px;transition:.15s;
}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item:hover{background:var(--bg-card);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg, rgba(224,185,74,.18), transparent);color:var(--gold-bright);font-weight:700}
.nav-item.active .ic{color:var(--gold)}
.sidebar .spacer{flex:1}
.sidebar .logout{margin-top:10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 24px;
  border-bottom:1px solid var(--border);background:rgba(21,21,24,.7);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
.topbar .titleblock h2{margin:0;font-size:17px}
.topbar .titleblock span{font-size:12px;color:var(--text-dim)}
.topbar .right{display:flex;align-items:center;gap:14px}
.topbar .clock{font-size:12px;color:var(--text-dim);text-align:left}
.bell{position:relative;cursor:pointer;font-size:18px;color:var(--text-dim)}
.bell .dot{position:absolute;top:-3px;left:-3px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--bg-panel)}
.menu-toggle{display:none;font-size:20px;background:none;border:none;color:var(--text);cursor:pointer}

.content{padding:22px 24px 60px;flex:1}
.page{animation:fadeUp .35s ease}

/* ---------- Cards / stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
  transition:.2s;
}
.stat-card:hover{border-color:#3a3a30;transform:translateY(-2px)}
.stat-card .label{font-size:12px;color:var(--text-dim);margin-bottom:8px}
.stat-card .value{font-size:22px;font-weight:800;color:var(--gold-bright)}
.stat-card .value.small{font-size:17px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-title h3{margin:0;font-size:15px;color:var(--text)}
.section-title h3:before{content:"";display:inline-block;width:4px;height:14px;background:var(--gold);border-radius:3px;margin-left:8px;vertical-align:-1px}

.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}

/* ---------- Buttons row / toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{
  background:#101012;border:1px solid var(--border);color:var(--text);padding:9px 12px;
  border-radius:9px;font-size:13px;
}
.toolbar .grow{flex:1;min-width:160px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead th{
  background:#19191c;color:var(--text-dim);text-align:right;padding:11px 14px;font-weight:600;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1e1e22}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.green{background:rgba(61,220,132,.15);color:var(--green)}
.badge.gold{background:rgba(224,185,74,.15);color:var(--gold-bright)}
.badge.blue{background:rgba(59,157,253,.15);color:var(--blue)}
.badge.red{background:rgba(224,83,83,.15);color:var(--red)}
.row-actions{display:flex;gap:6px}
.icon-btn{
  background:#101012;border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;
  border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-bright)}

/* ---------- Product / catalog cards ---------- */
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.p-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;transition:.2s;display:flex;flex-direction:column;
}
.p-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.p-card .img{height:120px;background:#101012 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:12px}
.p-card .body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px}
.p-card .cat{font-size:10.5px;color:var(--gold)}
.p-card .name{font-size:14px;font-weight:700}
.p-card .type{font-size:11.5px;color:var(--text-dim)}
.p-card .prices{margin-top:6px;font-size:12.5px}
.p-card .prices .c{color:var(--text-dim);text-decoration:line-through;font-size:11px}
.p-card .prices .co{color:var(--gold-bright);font-weight:700}
.p-card .stock-off{color:var(--red);font-size:11px;font-weight:700}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:16px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);
  animation:fadeUp .25s ease;
}
.modal h3{margin:0 0 16px;font-size:16px;color:var(--gold-bright)}
.modal .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .form-grid .full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ---------- Toast ---------- */
#toastHost{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--bg-panel);border:1px solid var(--border);border-right:4px solid var(--gold);
  padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);min-width:220px;
  animation:fadeUp .25s ease;
}
.toast.success{border-right-color:var(--green)}
.toast.error{border-right-color:var(--red)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--text-dim)}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.5}

/* ---------- Order builder ---------- */
.order-steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.order-steps span{
  font-size:11px;padding:6px 12px;border-radius:20px;background:var(--bg-card);color:var(--text-dim);
  border:1px solid var(--border);
}
.order-steps span.active{background:var(--gold);color:#141105;font-weight:700;border-color:var(--gold)}
.qty-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.qty-ctrl{display:flex;align-items:center;gap:10px}
.qty-ctrl button{width:28px;height:28px;border-radius:8px;background:#101012;border:1px solid var(--border);color:var(--gold);font-size:15px;cursor:pointer}
.summary-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--text-dim)}
.summary-row.total{color:var(--gold-bright);font-weight:800;font-size:15px;border-top:1px solid var(--border);padding-top:10px;margin-top:6px}

/* ---------- Chat / messages ---------- */
.chat-box{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:6px}
.msg{max-width:75%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.7}
.msg.out{align-self:flex-end;background:var(--gold);color:#141105;border-bottom-left-radius:2px}
.msg.in{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);border-bottom-right-radius:2px}
.msg .t{font-size:10px;opacity:.6;margin-top:4px}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .sidebar{
    position:fixed;right:0;top:0;transform:translateX(100%);z-index:100;box-shadow:var(--shadow);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .modal .form-grid{grid-template-columns:1fr}
}
@media(max-width:520px){
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>

<script>
/* ===================== Kia Rice — Firestore REST layer =====================
   Talks to Firestore via plain REST (no SDK) to avoid module loading issues
   on GitHub Pages. Project: kiarice — single doc at appdata/main holds
   the entire app state as one JSON blob (see DEFAULT_DATA in data.js).
============================================================================ */

const FIREBASE_PROJECT_ID = "kiarice";
const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;
const DOC_PATH = "appdata/main";

/* ---- JS value -> Firestore "fields" value ---- */
function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === "string") return { stringValue: val };
  if (typeof val === "boolean") return { booleanValue: val };
  if (typeof val === "number") {
    return Number.isInteger(val)
      ? { integerValue: String(val) }
      : { doubleValue: val };
  }
  if (Array.isArray(val)) {
    return { arrayValue: { values: val.map(toFirestoreValue) } };
  }
  if (typeof val === "object") {
    const fields = {};
    for (const k in val) fields[k] = toFirestoreValue(val[k]);
    return { mapValue: { fields } };
  }
  return { stringValue: String(val) };
}

/* ---- Firestore value -> JS value ---- */
function fromFirestoreValue(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue, 10);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) {
    const vals = v.arrayValue.values || [];
    return vals.map(fromFirestoreValue);
  }
  if ("mapValue" in v) {
    const fields = v.mapValue.fields || {};
    const out = {};
    for (const k in fields) out[k] = fromFirestoreValue(fields[k]);
    return out;
  }
  return null;
}

function jsToFirestoreDoc(obj) {
  const fields = {};
  for (const k in obj) fields[k] = toFirestoreValue(obj[k]);
  return { fields };
}

function firestoreDocToJs(doc) {
  if (!doc || !doc.fields) return {};
  const out = {};
  for (const k in doc.fields) out[k] = fromFirestoreValue(doc.fields[k]);
  return out;
}

/* ---- Public API ---- */
const KiaDB = {
  async load() {
    // cache: "no-store" + a timestamp query param guarantee we never get a
    // stale cached copy of appdata/main from the browser or any CDN in front
    // of it — this is what was causing saved changes (photos, passwords,
    // usernames) to appear to "revert" after navigating or logging back in.
    // NOTE: no custom headers here — adding a Cache-Control header triggers
    // a CORS preflight that Firestore's REST endpoint rejects, which is what
    // caused the "Load failed" error.
    const res = await fetch(`${FIRESTORE_BASE}/${DOC_PATH}?_ts=${Date.now()}`, {
      cache: "no-store",
    });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("خطا در دریافت اطلاعات از سرور");
    const doc = await res.json();
    return firestoreDocToJs(doc);
  },

  async save(data) {
    const body = JSON.stringify(jsToFirestoreDoc(data));
    let res;
    try {
      res = await fetch(`${FIRESTORE_BASE}/${DOC_PATH}`, {
        method: "PATCH",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body,
      });
    } catch (networkErr) {
      // fetch() itself threw — this is a real network/CORS-level failure,
      // before any response was received.
      throw new Error("خطای شبکه هنگام ذخیره‌سازی: " + networkErr.message);
    }
    if (!res.ok) {
      let detail = "";
      try {
        const errJson = await res.json();
        detail = errJson?.error?.message || JSON.stringify(errJson);
      } catch (e) {
        detail = await res.text().catch(() => "");
      }
      throw new Error(`خطا در ذخیره اطلاعات (کد ${res.status}): ${detail}`);
    }
    return true;
  },
};

const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function toFaDigits(input) {
  return String(input).replace(/[0-9]/g, (d) => FA_DIGITS[d]);
}

function formatMoney(thousands) {
  if (thousands === null || thousands === undefined || isNaN(thousands)) return "—";
  const n = Math.round(thousands);
  const withCommas = n.toLocaleString("en-US");
  return toFaDigits(withCommas) + " هزار تومان";
}

function formatTomanFull(thousands) {
  if (thousands === null || thousands === undefined || isNaN(thousands)) return "—";
  return formatMoney(thousands);
}

/* ---- Jalali (Shamsi) date conversion — pure JS, no library ---- */
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy;
  gy = gm > 2 ? gy + 1 : gy;
  let days =
    355666 +
    365 * gy +
    Math.floor((gy + 8) / 4) -
    Math.floor((gy + 99) / 100) +
    Math.floor((gy + 399) / 400) +
    gd +
    g_d_m[gm - 1];
  jy = -1595 + 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) {
    jy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }
  let jm, jd;
  if (days < 186) {
    jm = 1 + Math.floor(days / 31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days - 186) / 30);
    jd = 1 + ((days - 186) % 30);
  }
  return [jy, jm, jd];
}

const JALALI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WEEKDAYS_FA = ["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه","شنبه"];

function jalaliDateString(ts) {
  const d = ts ? new Date(ts) : new Date();
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return `${WEEKDAYS_FA[d.getDay()]} ${toFaDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${toFaDigits(jy)}`;
}
function jalaliDateShort(ts) {
  const d = ts ? new Date(ts) : new Date();
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return `${toFaDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${toFaDigits(jy)}`;
}
function timeString(ts) {
  const d = ts ? new Date(ts) : new Date();
  const h = String(d.getHours()).padStart(2, "0");
  const m = String(d.getMinutes()).padStart(2, "0");
  return toFaDigits(`${h}:${m}`);
}

function isSameDay(ts, ref) {
  const a = new Date(ts), b = ref || new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function isSameMonth(ts, ref) {
  const a = new Date(ts), b = ref || new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
}

function genOrderNumber(existingOrders) {
  const n = (existingOrders?.length || 0) + 1;
  return "KR-" + String(1000 + n);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function confirmDialog(message, onYes) {
  openModal(`
    <h3>تایید عملیات</h3>
    <p style="color:var(--text-dim);font-size:13.5px;line-height:1.8">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
      <button class="btn danger" id="confirmYesBtn">تایید و ادامه</button>
    </div>
  `);
  document.getElementById("confirmYesBtn").addEventListener("click", () => {
    closeModal();
    onYes();
  });
}


/* ===================== Kia Rice — App Core ===================== */

let DB = null;              // in-memory mirror of Firestore appdata/main
let CURRENT_USER = null;    // {role:'admin'|'marketer', id, name, username}
let CURRENT_PAGE = null;
let SAVE_TIMER = null;

/* ---------- Boot ---------- */
window.addEventListener("DOMContentLoaded", boot);

async function boot() {
  try {
    let data = await KiaDB.load();
    if (!data || !data.users) {
      data = DEFAULT_DATA;
      await KiaDB.save(data);
    }
    DB = data;
  } catch (e) {
    console.error(e);
    DB = DEFAULT_DATA;
  }

  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    tryRestoreSession();
  }, 2600);

  setInterval(updateClock, 1000 * 15);
}

function tryRestoreSession() {
  const saved = localStorage.getItem("kiarice_session");
  if (saved) {
    try {
      const s = JSON.parse(saved);
      const user = findUser(s.role, s.username);
      if (user) {
        loginSuccess(s.role, user);
        return;
      }
    } catch (e) {}
  }
  showLogin();
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("loginTitle").textContent = DB.settings.loginText || "ورود به سامانه";
  document.getElementById("loginBtn").addEventListener("click", handleLogin);
  document.getElementById("loginPass").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });
}

function findUser(role, username) {
  if (role === "admin") {
    return DB.users.admin.username === username ? DB.users.admin : null;
  }
  return (DB.users.marketers || []).find((m) => m.username === username && m.active !== false) || null;
}

function handleLogin() {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";

  if (!username || !password) {
    errEl.textContent = "نام کاربری و رمز عبور را وارد کنید.";
    return;
  }

  if (DB.users.admin.username === username && DB.users.admin.password === password) {
    localStorage.setItem("kiarice_session", JSON.stringify({ role: "admin", username }));
    loginSuccess("admin", DB.users.admin);
    return;
  }

  const marketer = (DB.users.marketers || []).find((m) => m.username === username);
  if (marketer && marketer.active === false) {
    errEl.textContent = "حساب شما غیرفعال شده است. با مدیر تماس بگیرید.";
    return;
  }
  if (marketer && marketer.password === password) {
    localStorage.setItem("kiarice_session", JSON.stringify({ role: "marketer", username }));
    marketer.lastLogin = Date.now();
    persist();
    loginSuccess("marketer", marketer);
    return;
  }

  errEl.textContent = "نام کاربری یا رمز عبور اشتباه است.";
}

function loginSuccess(role, userObj) {
  CURRENT_USER =
    role === "admin"
      ? { role: "admin", id: "admin", name: userObj.name, username: userObj.username }
      : { role: "marketer", id: userObj.id, name: userObj.firstName + " " + userObj.lastName, username: userObj.username };

  logActivity(CURRENT_USER.name, "ورود به سامانه", role === "admin" ? "ورود مدیر" : "ورود بازاریاب");

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.add("show");
  document.getElementById("sidebarRole").textContent = role === "admin" ? "پنل مدیریت" : "پنل بازاریاب";

  buildSidebar();
  updateClock();
  wireGlobalUi();
  navigate(role === "admin" ? "dashboard" : "dashboard");
}

function logout() {
  localStorage.removeItem("kiarice_session");
  CURRENT_USER = null;
  document.getElementById("app").classList.remove("show");
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginScreen").classList.remove("hidden");
}

function wireGlobalUi() {
  document.getElementById("logoutBtn").onclick = () => confirmDialog("از حساب کاربری خارج می‌شوید؟", logout);
  document.getElementById("menuToggle").onclick = () => document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("bellIcon").onclick = () => navigate(CURRENT_USER.role === "admin" ? "settings" : "notifications");
}

function updateClock() {
  const box = document.getElementById("clockBox");
  if (!box) return;
  box.innerHTML = `${jalaliDateShort()}<br>${timeString()}`;
}

/* ---------- Persistence ---------- */
function persist() {
  DB.meta.updatedAt = Date.now();
  clearTimeout(SAVE_TIMER);
  // Save immediately (no debounce) so a quick tab-switch/close on mobile
  // can't cancel a pending write before it ever reaches Firestore.
  const p = KiaDB.save(DB).catch((e) => {
    toast("خطا در ذخیره‌سازی: " + (e.message || "نامشخص"), "error");
    throw e;
  });
  return p;
}

function logActivity(user, action, detail) {
  DB.activityLog = DB.activityLog || [];
  DB.activityLog.unshift({ id: uid("log"), user, action, detail: detail || "", at: Date.now() });
  DB.activityLog = DB.activityLog.slice(0, 300);
}

function notify(to, title, message, type) {
  DB.notifications = DB.notifications || [];
  DB.notifications.unshift({
    id: uid("ntf"),
    to, // 'admin' | 'all' | marketerId
    title,
    message,
    type: type || "info",
    read: false,
    createdAt: Date.now(),
  });
}

function myNotifications() {
  if (!DB.notifications) return [];
  if (CURRENT_USER.role === "admin") return DB.notifications.filter((n) => n.to === "admin");
  return DB.notifications.filter((n) => n.to === "all" || n.to === CURRENT_USER.id);
}

function refreshBell() {
  const unread = myNotifications().filter((n) => !n.read).length;
  document.getElementById("bellDot").classList.toggle("hidden", unread === 0);
}

function buildSidebar() {
  const nav = CURRENT_USER.role === "admin" ? ADMIN_NAV : MARKETER_NAV;
  const host = document.getElementById("navList");
  host.innerHTML = nav
    .map(
      (n) => `<div class="nav-item" data-key="${n.key}"><span class="ic">${n.ic}</span> ${n.label}</div>`
    )
    .join("");
  host.querySelectorAll(".nav-item").forEach((el) => {
    el.addEventListener("click", () => {
      navigate(el.dataset.key);
      document.getElementById("sidebar").classList.remove("open");
    });
  });
}

function setActiveNav(key) {
  document.querySelectorAll(".nav-item").forEach((el) => el.classList.toggle("active", el.dataset.key === key));
}

function navigate(key) {
  CURRENT_PAGE = key;
  setActiveNav(key);
  const nav = CURRENT_USER.role === "admin" ? ADMIN_NAV : MARKETER_NAV;
  const found = nav.find((n) => n.key === key);
  document.getElementById("pageTitle").textContent = found ? found.label : "";
  document.getElementById("pageSubtitle").textContent = jalaliDateString();
  refreshBell();

  const renderer = CURRENT_USER.role === "admin" ? ADMIN_PAGES[key] : MARKETER_PAGES[key];
  const el = document.getElementById("pageContent");
  if (renderer) {
    el.innerHTML = "";
    renderer(el);
  } else {
    el.innerHTML = `<div class="empty"><div class="ic">🚧</div>این بخش در دست ساخت است.</div>`;
  }
}

function rerender() {
  navigate(CURRENT_PAGE);
}

function productById(id) {
  return (DB.products || []).find((p) => p.id === id);
}
function customerById(id) {
  return (DB.customers || []).find((c) => c.id === id);
}
function marketerById(id) {

}

function effectivePrice(product) {
  if (product.offerPrice) return product.offerPrice;
  return product.consumerPrice;
}

/* ============ 0. Dashboard ============ */
function renderAdminDashboard(el) {
  const today = new Date();
  const orders = DB.orders || [];
  const todaysOrders = orders.filter((o) => isSameDay(o.createdAt, today));
  const todaysSales = todaysOrders.reduce((s, o) => s + (o.total || 0), 0);
  const activeMarketers = (DB.users.marketers || []).filter((m) => m.active !== false).length;
  const pending = orders.filter((o) => o.status === "pending").length;
  const shipped = orders.filter((o) => o.status === "shipped" || o.status === "delivered").length;
  const stock = (DB.products || []).reduce((s, p) => s + (p.stock || 0), 0);
  const newNotifs = (DB.notifications || []).filter((n) => n.to === "admin" && !n.read).length;

  el.innerHTML = `
    <div class="panel" style="margin-bottom:20px">
      <div style="font-size:15px">سلام، ${escapeHtml(CURRENT_USER.name)} 👋</div>
      <div style="color:var(--text-dim);font-size:12.5px;margin-top:4px">امروز ${jalaliDateString()} — ساعت ${timeString()}</div>
    </div>

    <div class="stat-grid">
      ${statCard("سفارش‌های امروز", toFaDigits(todaysOrders.length))}
      ${statCard("فروش امروز", formatMoney(todaysSales), true)}
      ${statCard("مشتریان ثبت‌شده", toFaDigits((DB.customers || []).length))}
      ${statCard("بازاریاب‌های فعال", toFaDigits(activeMarketers))}
      ${statCard("سفارش‌های در انتظار", toFaDigits(pending))}
      ${statCard("سفارش‌های ارسال‌شده", toFaDigits(shipped))}
      ${statCard("موجودی انبار (کیسه)", toFaDigits(stock))}
      ${statCard("اعلان‌های جدید", toFaDigits(newNotifs))}
    </div>

    <div class="section-title"><h3>آخرین سفارش‌ها</h3></div>
    ${renderOrdersTable(orders.slice(0, 6), true)}

    <div class="section-title"><h3>محصولات رو به اتمام</h3></div>
    ${renderLowStockList()}
  `;
  wireOrderActions(el);
}

function statCard(label, value, small) {
  return `<div class="stat-card"><div class="label">${label}</div><div class="value${small ? " small" : ""}">${value}</div></div>`;
}

function renderLowStockList() {
  const low = (DB.products || []).filter((p) => p.active !== false && p.stock <= (p.lowStockThreshold || 50));
  if (!low.length) return `<div class="empty" style="padding:24px"><div class="ic">✅</div>موجودی همه محصولات مناسب است.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>محصول</th><th>موجودی</th><th>حد هشدار</th></tr></thead><tbody>
    ${low.map((p) => `<tr><td>${escapeHtml(p.name)}</td><td><span class="badge red">${toFaDigits(p.stock)}</span></td><td>${toFaDigits(p.lowStockThreshold || 50)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

            logActivity(CURRENT_USER.name, "حذف محصول", b.dataset.del);
            persist();
            renderProdTable();
            toast("محصول حذف شد.", "success");
          }))
    );
  }
}

      const file = fileInput.files[0];
      if (file.size > 25 * 1024 * 1024) return toast("حجم فایل نباید بیشتر از ۲۵ مگابایت باشد.", "error");
      try {
        statusEl.textContent = "در حال آپلود فایل... لطفاً صبر کنید";
        document.getElementById("saveProductBtn").disabled = true;
        imageUrl = await uploadMediaFile(file, "products");
        statusEl.textContent = "آپلود کامل شد ✅";

        document.getElementById("saveProductBtn").disabled = false;
        statusEl.textContent = "";
        return toast(e.message || "آپلود فایل ناموفق بود.", "error");
      }
      document.getElementById("saveProductBtn").disabled = false;
    }

    if (p) {
      if (p.consumerPrice !== newPrice || p.offerPrice !== newOffer) {
        p.priceHistory = p.priceHistory || [];
        p.priceHistory.unshift({ at: Date.now(), consumerPrice: newPrice, offerPrice: newOffer, by: CURRENT_USER.name });
        notify("all", "تغییر قیمت محصول", `قیمت «${name}» به‌روزرسانی شد.`, "price");

      p.code = document.getElementById("f_code").value.trim();
      p.category = document.getElementById("f_cat").value;
      p.type = document.getElementById("f_type").value.trim();
      p.weight = numOrNull(document.getElementById("f_weight").value) || 10;
      p.stock = numOrNull(document.getElementById("f_stock").value) || 0;
      p.consumerPrice = newPrice;
      p.coopPrice = numOrNull(document.getElementById("f_coop").value);
      p.offerPrice = newOffer;
      p.discountPercent = numOrNull(document.getElementById("f_disc").value) || 0;
      p.shortDesc = document.getElementById("f_short").value.trim();
      p.fullDesc = document.getElementById("f_full").value.trim();
      p.features = document.getElementById("f_feat").value.trim();
      p.image = imageUrl;
      logActivity(CURRENT_USER.name, "ویرایش محصول", name);
      toast("محصول ویرایش شد.", "success");
    } else {
      DB.products.push({
        id: uid("p"),
        name,
        code: document.getElementById("f_code").value.trim(),
        category: document.getElementById("f_cat").value,
        type: document.getElementById("f_type").value.trim(),
        weight: numOrNull(document.getElementById("f_weight").value) || 10,
        stock: numOrNull(document.getElementById("f_stock").value) || 0,
        consumerPrice: newPrice,
        coopPrice: numOrNull(document.getElementById("f_coop").value),
        offerPrice: newOffer,
        discountPercent: numOrNull(document.getElementById("f_disc").value) || 0,
        shortDesc: document.getElementById("f_short").value.trim(),
        fullDesc: document.getElementById("f_full").value.trim(),
        features: document.getElementById("f_feat").value.trim(),
        packaging: "",
        image: imageUrl,
        active: true,
        lowStockThreshold: 50,
        priceHistory: [],
      });
      logActivity(CURRENT_USER.name, "افزودن محصول", name);
      toast("محصول افزوده شد.", "success");
    }
    document.getElementById("saveProductBtn").disabled = true;
    statusEl.textContent = "در حال ذخیره تغییرات...";
    try {
      await persist();
    } catch (e) {
      document.getElementById("saveProductBtn").disabled = false;
      statusEl.textContent = "";
      return; // toast already shown by persist()
    }
    closeModal();
    rerender();
  };
}
function numOrNull(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function estimateCommission(m, orders) {
  const now = new Date();
  const monthOrders = orders.filter((o) => isSameMonth(o.createdAt, now));
  const monthTonnage = monthOrders.reduce((s, o) => s + (o.items || []).reduce((a, it) => a + (it.qty * (productById(it.productId)?.weight || 10)) / 1000, 0), 0);
  const monthSales = monthOrders.reduce((s, o) => s + (o.total || 0), 0);
  const rate = monthTonnage > 5 ? (m.commissionTier2 || 3) : (m.commissionTier1 || 2);
  return (monthSales * rate) / 100;
}

function renderAdminCustomers(el) {
  el.innerHTML = `
    <div class="toolbar">
      <input class="grow" id="custSearch" placeholder="جستجوی نام، شهر یا شماره...">
      <select id="custMkFilter"><option value="">همه بازاریاب‌ها</option>
        ${(DB.users.marketers || []).map((m) => `<option value="${m.id}">${escapeHtml(m.firstName)} ${escapeHtml(m.lastName)}</option>`).join("")}
      </select>
    </div>
    <div id="custTableHost"></div>
  `;
  const s = document.getElementById("custSearch"),
    f = document.getElementById("custMkFilter");
  [s, f].forEach((x) => x.addEventListener("input", draw));
  draw();
  function draw() {
    const q = s.value.trim().toLowerCase();
    let list = DB.customers || [];
    if (f.value) list = list.filter((c) => c.marketerId === f.value);
    if (q) list = list.filter((c) => (c.shopName + c.city + c.phone).toLowerCase().includes(q));

function computeInsights() {
  const out = [];
  const orders = DB.orders || [];
  const products = DB.products || [];

  products.forEach((p) => {
    if (p.active !== false && p.stock <= (p.lowStockThreshold || 50)) {
      out.push({ ic: "⚠️", text: `موجودی «${escapeHtml(p.name)}» رو به اتمام است (${toFaDigits(p.stock)} کیسه باقی مانده).` });
    }
  });

  // week over week per product
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;
  const twoWeeksAgo = now - 14 * 86400000;
  const byProdThis = {}, byProdLast = {};
  orders.forEach((o) => {
    const bucket = o.createdAt >= weekAgo ? byProdThis : o.createdAt >= twoWeeksAgo ? byProdLast : null;
    if (!bucket) return;
    o.items.forEach((it) => (bucket[it.productId] = (bucket[it.productId] || 0) + it.qty));
  });
  Object.keys(byProdLast).forEach((pid) => {
    const p = productById(pid);
    if (!p) return;
    const before = byProdLast[pid];
    const after = byProdThis[pid] || 0;
    if (before >= 3) {
      const change = Math.round(((after - before) / before) * 100);
      if (change <= -15) out.push({ ic: "📉", text: `فروش «${escapeHtml(p.name)}» نسبت به هفته گذشته ${toFaDigits(Math.abs(change))}٪ کاهش داشته است.` });
      if (change >= 25) out.push({ ic: "📈", text: `فروش «${escapeHtml(p.name)}» نسبت به هفته گذشته ${toFaDigits(change)}٪ رشد داشته است.` });
    }
  });

  // overall revenue trend week over week
  const salesThis = orders.filter((o) => o.createdAt >= weekAgo).reduce((s, o) => s + o.total, 0);
  const salesLast = orders.filter((o) => o.createdAt >= twoWeeksAgo && o.createdAt < weekAgo).reduce((s, o) => s + o.total, 0);
  if (salesLast > 0) {
    const change = Math.round(((salesThis - salesLast) / salesLast) * 100);
    if (Math.abs(change) >= 10) {
      out.push({
        ic: change > 0 ? "📈" : "📉",
        text: `فروش کل این هفته نسبت به هفته گذشته ${toFaDigits(Math.abs(change))}٪ ${change > 0 ? "رشد" : "کاهش"} داشته است (${formatMoney(salesThis)} در برابر ${formatMoney(salesLast)}).`,
      });
    }
  }

  // top product overall (all time)
  const byProdAll = {};
  orders.forEach((o) => o.items.forEach((it) => (byProdAll[it.productId] = (byProdAll[it.productId] || 0) + it.qty)));
  const topAll = Object.entries(byProdAll).sort((a, b) => b[1] - a[1])[0];
  if (topAll) {
    const p = productById(topAll[0]);
    if (p) out.push({ ic: "🥇", text: `پرفروش‌ترین محصول تا امروز «${escapeHtml(p.name)}» با ${toFaDigits(topAll[1])} کیسه فروش است.` });
  }

  // cancellation rate
  if (orders.length >= 8) {
    const cancelled = orders.filter((o) => o.status === "cancelled").length;
    const rate = Math.round((cancelled / orders.length) * 100);
    if (rate >= 15) out.push({ ic: "🚫", text: `${toFaDigits(rate)}٪ از سفارش‌های ثبت‌شده لغو شده‌اند؛ بررسی دلیل لغو سفارش‌ها می‌تواند مفید باشد.` });
  }

  // best marketer this week
  const mkSales = {};
  orders.filter((o) => o.createdAt >= weekAgo).forEach((o) => (mkSales[o.marketerId] = (mkSales[o.marketerId] || 0) + o.total));
  const bestMk = Object.entries(mkSales).sort((a, b) => b[1] - a[1])[0];
  if (bestMk) {
    const m = marketerById(bestMk[0]);
    if (m) out.push({ ic: "🏆", text: `بازاریاب برتر این هفته: ${escapeHtml(m.firstName)} ${escapeHtml(m.lastName)} با فروش ${formatMoney(bestMk[1])}` });
  }

  // spread between best & weakest marketer (this month)
  const mkList = DB.users.marketers || [];
  if (mkList.length >= 2) {
    const monthSales = mkList.map((m) => ({ m, sales: ordersOf(m.id).filter((o) => isSameMonth(o.createdAt)).reduce((s, o) => s + o.total, 0) }));
    monthSales.sort((a, b) => b.sales - a.sales);
    const top = monthSales[0], bottom = monthSales[monthSales.length - 1];
    if (top.sales > 0 && bottom.sales < top.sales * 0.3) {
      out.push({ ic: "📊", text: `اختلاف زیادی بین عملکرد بازاریاب‌ها دیده می‌شود؛ ${escapeHtml(bottom.m.firstName)} ${escapeHtml(bottom.m.lastName)} نسبت به ${escapeHtml(top.m.firstName)} فروش بسیار کمتری در این ماه داشته است.` });
    }
  }

  // inactive customers (no order in 45 days)
  const cutoffInactive = now - 45 * 86400000;
  (DB.customers || []).forEach((c) => {
    const co = (DB.orders || []).filter((o) => o.customerId === c.id);
    if (!co.length) return;
    const last = Math.max(...co.map((o) => o.createdAt));
    if (last < cutoffInactive) out.push({ ic: "⏳", text: `مشتری «${escapeHtml(c.shopName)}» مدت زیادی است خرید نکرده است.` });
  });

  return out.slice(0, 14);
}

function answerAiQuestion(q) {
  const orders = DB.orders || [];
  const todays = orders.filter((o) => isSameDay(o.createdAt));
  if (!q) return "یک سؤال بنویسید تا بر اساس داده‌های واقعی سامانه پاسخ بدهم.";

  if (q.includes("امروز") && (q.includes("فروش") || q.includes("محصول"))) {
    const byP = {};
    todays.forEach((o) => o.items.forEach((it) => (byP[it.productId] = (byP[it.productId] || 0) + it.qty)));
    const top = Object.entries(byP).sort((a, b) => b[1] - a[1])[0];
    if (!top) return "امروز هنوز سفارشی ثبت نشده است.";
    return `بیشترین فروش امروز مربوط به «${escapeHtml(productById(top[0])?.name || "")}» با ${toFaDigits(top[1])} کیسه بوده است.`;
  }

  if (q.includes("پرفروش")) {
    const byP = {};
    orders.forEach((o) => o.items.forEach((it) => (byP[it.productId] = (byP[it.productId] || 0) + it.qty)));
    const top = Object.entries(byP).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (!top.length) return "هنوز سفارشی ثبت نشده است.";
    return "پرفروش‌ترین محصولات: " + top.map(([pid, qty]) => `«${escapeHtml(productById(pid)?.name || "")}» (${toFaDigits(qty)} کیسه)`).join("، ");
  }

  if ((q.includes("بهترین") || q.includes("برتر")) && q.includes("بازاریاب")) {
    const mkSales = {};
    (DB.users.marketers || []).forEach((m) => (mkSales[m.id] = ordersOf(m.id).reduce((s, o) => s + o.total, 0)));
    const best = Object.entries(mkSales).sort((a, b) => b[1] - a[1])[0];
    if (!best) return "هنوز داده‌ای برای بازاریاب‌ها ثبت نشده است.";
    const m = marketerById(best[0]);
    return `بهترین عملکرد تجمعی مربوط به ${m ? escapeHtml(m.firstName) + " " + escapeHtml(m.lastName) : "—"} با فروش ${formatMoney(best[1])} است.`;
  }

  if (q.includes("ضعیف") && q.includes("بازاریاب")) {
    const mkSales = {};
    (DB.users.marketers || []).forEach((m) => (mkSales[m.id] = ordersOf(m.id).reduce((s, o) => s + o.total, 0)));
    const worst = Object.entries(mkSales).sort((a, b) => a[1] - b[1])[0];
    if (!worst) return "هنوز داده‌ای برای بازاریاب‌ها ثبت نشده است.";
    const m = marketerById(worst[0]);
    return `کمترین فروش تجمعی مربوط به ${m ? escapeHtml(m.firstName) + " " + escapeHtml(m.lastName) : "—"} است.`;
  }

  if (q.includes("موجودی") && (q.includes("کم") || q.includes("اتمام") || q.includes("تمام"))) {
    const low = (DB.products || []).filter((p) => p.active !== false && p.stock <= (p.lowStockThreshold || 50));
    if (!low.length) return "در حال حاضر موجودی هیچ محصولی رو به اتمام نیست.";
    return "محصولات رو به اتمام: " + low.map((p) => `«${escapeHtml(p.name)}» (${toFaDigits(p.stock)} کیسه)`).join("، ");
  }

  if (q.includes("مشتری") && (q.includes("نکرده") || q.includes("غیرفعال"))) {
    const now = Date.now();
    const cutoff = now - 45 * 86400000;
    const list = (DB.customers || []).filter((c) => {
      const co = (DB.orders || []).filter((o) => o.customerId === c.id);
      if (!co.length) return false;
      return Math.max(...co.map((o) => o.createdAt)) < cutoff;
    });
    if (!list.length) return "مشتری غیرفعال (بدون خرید بیش از ۴۵ روز) یافت نشد.";
    return "مشتریان غیرفعال: " + list.map((c) => escapeHtml(c.shopName)).join("، ");
  }

  if (q.includes("مشتری") && (q.includes("بیشترین") || q.includes("بهترین"))) {
    const byC = {};
    orders.forEach((o) => (byC[o.customerId] = (byC[o.customerId] || 0) + o.total));
    const top = Object.entries(byC).sort((a, b) => b[1] - a[1])[0];
    if (!top) return "هنوز سفارشی برای مشتریان ثبت نشده است.";
    const c = customerById(top[0]);
    return c ? `بیشترین خرید مربوط به «${escapeHtml(c.shopName)}» با مجموع ${formatMoney(top[1])} است.` : "داده‌ای یافت نشد.";
  }

  if (q.includes("این ماه") || (q.includes("ماه") && q.includes("خلاصه"))) {
    const now = new Date();
    const mOrders = orders.filter((o) => isSameMonth(o.createdAt, now));
    const sales = mOrders.reduce((s, o) => s + o.total, 0);
    return `این ماه ${toFaDigits(mOrders.length)} سفارش با مجموع فروش ${formatMoney(sales)} ثبت شده است.`;
  }

  if (q.includes("پیشنهاد") || q.includes("افزایش فروش") || q.includes("هفته آینده")) {
    const insights = computeInsights();
    const sug = insights.find((i) => i.ic === "📉");
    if (sug) return sug.text + " پیشنهاد می‌شود برای این محصول آفر موقت فعال شود.";
    const top = insights.find((i) => i.ic === "🥇");
    return top ? top.text + " می‌توانید روی همین محصول کمپین تخفیف کوتاه‌مدت اجرا کنید." : "روند فروش در حال حاضر پایدار است.";
  }

  return "این سؤال هنوز در دایره‌ی پاسخ‌های آماده نیست. می‌توانید بپرسید: «پرفروش‌ترین محصول»، «بهترین بازاریاب»، «موجودی کم»، «مشتریان غیرفعال»، «خلاصه این ماه» یا «پیشنهاد افزایش فروش». برای اطلاعات دقیق‌تر، بخش گزارش‌ها را هم ببینید.";
}

    const q = s.value.trim().toLowerCase();

            ? `<video src="${escapeHtml(p.image)}" class="img" style="object-fit:cover" muted></video>`

        <div class="field"><label>شماره دوم (اختیاری)</label><input id="f_phone2"></div>
        <div class="field"><label>استان</label><input id="f_province"></div>
        <div class="field"><label>شهر</label><input id="f_city"></div>
        <div class="field full"><label>آدرس</label><input id="f_addr"></div>
        <div class="field full"><label>توضیحات</label><textarea id="f_notes" rows="2"></textarea></div>
        <div class="field full"><label>عکس فروشگاه (اختیاری)</label><input id="f_shopphoto" type="file" accept="image/*"></div>
      </div>
      <div id="custUploadStatus" style="font-size:12px;color:var(--text-dim);margin-top:6px"></div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn" id="saveCustBtn">ثبت مشتری</button>
      </div>
    </div>
  `;
  document.getElementById("saveCustBtn").onclick = async () => {
    const shopName = document.getElementById("f_shop").value.trim();
    const phone = document.getElementById("f_phone1").value.trim();
    if (!shopName || !phone) return toast("نام فروشگاه و شماره تماس الزامی است.", "error");

    let photoUrl = "";
    const fileInput = document.getElementById("f_shopphoto");
    const statusEl = document.getElementById("custUploadStatus");
    if (fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      if (file.size > 15 * 1024 * 1024) return toast("حجم عکس نباید بیشتر از ۱۵ مگابایت باشد.", "error");
      try {
        statusEl.textContent = "در حال آپلود عکس...";
        document.getElementById("saveCustBtn").disabled = true;
        photoUrl = await uploadMediaFile(file, "customers");
      } catch (e) {
        document.getElementById("saveCustBtn").disabled = false;
        statusEl.textContent = "";
        return toast(e.message || "آپلود عکس ناموفق بود.", "error");
      }
      document.getElementById("saveCustBtn").disabled = false;
    }
    const c = {
      id: uid("cu"),
      marketerId: CURRENT_USER.id,
      shopName,
      ownerName: document.getElementById("f_owner").value.trim(),
      phone,
      phone2: document.getElementById("f_phone2").value.trim(),
      province: document.getElementById("f_province").value.trim(),
      city: document.getElementById("f_city").value.trim(),
      address: document.getElementById("f_addr").value.trim(),
      notes: document.getElementById("f_notes").value.trim(),
      photo: photoUrl,
      createdAt: Date.now(),
    };
    DB.customers.push(c);
    notify("admin", "مشتری جدید", `${escapeHtml(CURRENT_USER.name)} مشتری «${shopName}» را ثبت کرد.`, "customer");
    logActivity(CURRENT_USER.name, "ثبت مشتری جدید", shopName);
    persist();
    toast("مشتری با موفقیت ثبت شد.", "success");
    navigate("myCustomers");
  };
}

/* ============ New Order (wizard) ============ */
let ORDER_DRAFT = null;

function renderMkNewOrder(el) {
  ORDER_DRAFT = { customerId: null, items: {}, payment: "cash", step: 1 };
  drawOrderStep(el);
}

function drawOrderStep(el) {
  const steps = ["مشتری", "محصولات", "تعداد", "محاسبه", "پرداخت", "ثبت"];
  el.innerHTML = `
    <div class="order-steps">${steps.map((s, i) => `<span class="${ORDER_DRAFT.step === i + 1 ? "active" : ""}">${toFaDigits(i + 1)}. ${s}</span>`).join("")}</div>
    <div id="orderStepBody"></div>
  `;
  const body = document.getElementById("orderStepBody");

  if (ORDER_DRAFT.step === 1) {
    const myCust = customersOf(CURRENT_USER.id);
    body.innerHTML = `
      <div class="panel">
        <div class="field"><label>انتخاب مشتری</label>
          <select id="f_custSel"><option value="">— انتخاب کنید —</option>
            ${myCust.map((c) => `<option value="${c.id}">${escapeHtml(c.shopName)} — ${escapeHtml(c.phone)}</option>`).join("")}
          </select>
        </div>
        <div style="color:var(--text-dim);font-size:12px;margin:8px 0">مشتری مورد نظر را ندارید؟</div>
        <button class="btn ghost sm" onclick="navigate('newCustomer')">+ ثبت مشتری جدید</button>
      </div>
      <div class="modal-actions"><button class="btn" id="nextBtn1">ادامه</button></div>
    `;
    document.getElementById("nextBtn1").onclick = () => {
      const v = document.getElementById("f_custSel").value;
      if (!v) return toast("یک مشتری انتخاب کنید.", "error");
      ORDER_DRAFT.customerId = v;
      ORDER_DRAFT.step = 2;
      drawOrderStep(el);
    };
  }

  if (ORDER_DRAFT.step === 2) {
    const list = activeProducts();
    body.innerHTML = `
      <div class="catalog-grid">
        ${list
          .map(
            (p) => `<div class="p-card" data-pick="${p.id}" style="${ORDER_DRAFT.items[p.id] ? "border-color:var(--gold)" : ""}">
          <div class="img" style="${p.image ? `background-image:url('${escapeHtml(p.image)}')` : ""}">${p.image ? "" : "بدون تصویر"}</div>
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="type">${formatMoney(effectivePrice(p))}</div>
            ${ORDER_DRAFT.items[p.id] ? `<div class="badge gold">انتخاب شده: ${toFaDigits(ORDER_DRAFT.items[p.id])}</div>` : ""}
          </div>
        </div>`
          )
          .join("")}
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="backBtn2">بازگشت</button>
        <button class="btn" id="nextBtn2">ادامه</button>
      </div>
    `;
    body.querySelectorAll("[data-pick]").forEach(
      (c) =>
        (c.onclick = () => {
          const id = c.dataset.pick;
          ORDER_DRAFT.items[id] = (ORDER_DRAFT.items[id] || 0) + 1;
          drawOrderStep(el);
        })
    );
    document.getElementById("backBtn2").onclick = () => {
      ORDER_DRAFT.step = 1;
      drawOrderStep(el);
    };
    document.getElementById("nextBtn2").onclick = () => {
      if (!Object.keys(ORDER_DRAFT.items).length) return toast("حداقل یک محصول انتخاب کنید.", "error");
      ORDER_DRAFT.step = 3;
      drawOrderStep(el);
    };
  }

  if (ORDER_DRAFT.step === 3) {
    const rows = Object.entries(ORDER_DRAFT.items)
      .map(([pid, qty]) => {
        const p = productById(pid);
        return `<div class="qty-row">
          <div>${escapeHtml(p.name)}<div style="color:var(--text-dim);font-size:11px">${formatMoney(effectivePrice(p))} × ${toFaDigits(qty)}</div></div>
          <div class="qty-ctrl">
            <button data-dec="${pid}">−</button><span>${toFaDigits(qty)}</span><button data-inc="${pid}">+</button>
            <button class="icon-btn" data-rm="${pid}">🗑</button>
          </div>
        </div>`;
      })
      .join("");
    body.innerHTML = `<div class="panel">${rows}</div>
      <div class="modal-actions">
        <button class="btn ghost" id="backBtn3">بازگشت</button>
        <button class="btn" id="nextBtn3">ادامه</button>
      </div>`;
    body.querySelectorAll("[data-inc]").forEach((b) => (b.onclick = () => { ORDER_DRAFT.items[b.dataset.inc]++; drawOrderStep(el); }));
    body.querySelectorAll("[data-dec]").forEach(
      (b) =>
        (b.onclick = () => {
          ORDER_DRAFT.items[b.dataset.dec]--;
          if (ORDER_DRAFT.items[b.dataset.dec] <= 0) delete ORDER_DRAFT.items[b.dataset.dec];
          drawOrderStep(el);
        })
    );
    body.querySelectorAll("[data-rm]").forEach(
      (b) =>
        (b.onclick = () => {
          delete ORDER_DRAFT.items[b.dataset.rm];
          drawOrderStep(el);
        })
    );
    document.getElementById("backBtn3").onclick = () => { ORDER_DRAFT.step = 2; drawOrderStep(el); };
    document.getElementById("nextBtn3").onclick = () => {
      if (!Object.keys(ORDER_DRAFT.items).length) return toast("سبد سفارش خالی است.", "error");
      ORDER_DRAFT.step = 4;
      drawOrderStep(el);
    };
  }

  if (ORDER_DRAFT.step === 4) {
    const calc = calcOrderTotals();
    body.innerHTML = `
      <div class="panel">
        <div class="summary-row"><span>جمع کل</span><span>${formatMoney(calc.subtotal)}</span></div>
        <div class="summary-row"><span>تخفیف</span><span>${formatMoney(calc.discount)}</span></div>
        <div class="summary-row"><span>هزینه ارسال</span><span>${formatMoney(calc.shipping)}</span></div>
        <div class="summary-row total"><span>مبلغ قابل پرداخت</span><span>${formatMoney(calc.total)}</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="backBtn4">بازگشت</button>
        <button class="btn" id="nextBtn4">ادامه</button>
      </div>`;
    document.getElementById("backBtn4").onclick = () => { ORDER_DRAFT.step = 3; drawOrderStep(el); };
    document.getElementById("nextBtn4").onclick = () => { ORDER_DRAFT.step = 5; drawOrderStep(el); };
  }

  if (ORDER_DRAFT.step === 5) {
    body.innerHTML = `
      <div class="panel">
        <div class="field"><label>روش پرداخت</label>
          <select id="f_pay">${PAYMENT_METHODS.map((p) => `<option value="${p.key}">${p.label}</option>`).join("")}</select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="backBtn5">بازگشت</button>
        <button class="btn" id="nextBtn5">ثبت نهایی سفارش</button>
      </div>`;
    document.getElementById("backBtn5").onclick = () => { ORDER_DRAFT.step = 4; drawOrderStep(el); };
    document.getElementById("nextBtn5").onclick = () => {
      ORDER_DRAFT.payment = document.getElementById("f_pay").value;
      finalizeOrder(el);
    };
  }
}

function calcOrderTotals() {
  let subtotal = 0,
    discount = 0;
  Object.entries(ORDER_DRAFT.items).forEach(([pid, qty]) => {
    const p = productById(pid);
    const price = effectivePrice(p);
    subtotal += price * qty;
    if (p.consumerPrice && price < p.consumerPrice) discount += (p.consumerPrice - price) * qty;
  });
  const shipping = subtotal > 0 && subtotal < 3000 ? 150 : 0; // simple example shipping rule (هزار تومان)
  return { subtotal, discount, shipping, total: subtotal + shipping };
}

function finalizeOrder(el) {
  const calc = calcOrderTotals();
  const order = {
    id: uid("ord"),
    orderNumber: genOrderNumber(DB.orders),
    customerId: ORDER_DRAFT.customerId,
    marketerId: CURRENT_USER.id,
    items: Object.entries(ORDER_DRAFT.items).map(([pid, qty]) => ({ productId: pid, qty, price: effectivePrice(productById(pid)) })),
    subtotal: calc.subtotal,
    discount: calc.discount,
    shipping: calc.shipping,
    total: calc.total,
    paymentMethod: ORDER_DRAFT.payment,
    status: "pending",
    statusHistory: [{ status: "pending", at: Date.now(), by: CURRENT_USER.name }],
    createdAt: Date.now(),
  };
  DB.orders.push(order);
  // decrement stock
  order.items.forEach((it) => {
    const p = productById(it.productId);
    if (p) p.stock = Math.max(0, (p.stock || 0) - it.qty);
  });
  const cust = customerById(order.customerId);
  notify("admin", "سفارش جدید", `سفارش ${order.orderNumber} توسط ${escapeHtml(CURRENT_USER.name)} برای «${cust ? escapeHtml(cust.shopName) : ""}» ثبت شد.`, "order");
  logActivity(CURRENT_USER.name, "ثبت سفارش", order.orderNumber);
  persist();

  document.getElementById("orderStepBody").innerHTML = `
    <div class="empty">
      <div class="ic">✅</div>
      سفارش با موفقیت ثبت شد.<br>
      <div style="margin-top:8px;font-size:15px;color:var(--gold-bright);font-weight:800">${order.orderNumber}</div>
      <button class="btn" style="margin-top:16px" onclick="navigate('myOrders')">مشاهده سفارش‌های من</button>
    </div>
  `;
  toast("سفارش ثبت شد.", "success");
}

/* ============ My Customers ============ */
function renderMkMyCustomers(el) {
  const list = customersOf(CURRENT_USER.id);
  el.innerHTML = `
    <div class="toolbar"><input class="grow" id="mcSearch" placeholder="جستجو..."></div>
    <div id="mcHost"></div>
  `;
  document.getElementById("mcSearch").addEventListener("input", draw);
  draw();
  function draw() {
    const q = document.getElementById("mcSearch").value.trim().toLowerCase();
    const filtered = list.filter((c) => (c.shopName + c.city + c.phone).toLowerCase().includes(q));
    document.getElementById("mcHost").innerHTML = filtered.length
      ? `<div class="table-wrap"><table><thead><tr><th>فروشگاه</th><th>شهر</th><th>تماس</th><th>سفارش‌ها</th><th>مبلغ خرید</th><th>آخرین خرید</th><th></th></tr></thead><tbody>
        ${filtered
          .map((c) => {
            const co = (DB.orders || []).filter((o) => o.customerId === c.id);
            const total = co.reduce((s, o) => s + o.total, 0);
            const last = co.length ? Math.max(...co.map((o) => o.createdAt)) : null;
            return `<tr>
            <td>${escapeHtml(c.shopName)}</td><td>${escapeHtml(c.city || "—")}</td><td>${escapeHtml(c.phone)}</td>
            <td>${toFaDigits(co.length)}</td><td>${formatMoney(total)}</td><td>${last ? jalaliDateShort(last) : "—"}</td>
            <td><div class="row-actions">
              <a class="icon-btn" href="tel:${escapeHtml(c.phone)}" title="تماس">📞</a>
              <button class="icon-btn" data-order="${c.id}" title="ثبت سفارش">🧾</button>
            </div></td>
          </tr>`;
          })
          .join("")}
      </tbody></table></div>`
      : `<div class="empty"><div class="ic">👥</div>هنوز مشتری‌ای ثبت نکرده‌اید.</div>`;
    document.querySelectorAll("[data-order]").forEach(
      (b) =>
        (b.onclick = () => {
          navigate("newOrder");
          ORDER_DRAFT.customerId = b.dataset.order;
          ORDER_DRAFT.step = 2;
          drawOrderStep(document.getElementById("pageContent"));
        })
    );
  }
}
