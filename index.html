<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>کیارایس | سامانه مدیریت فروش برنج</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="assets/logo.png" alt="Kia Rice">
  <div class="brand">KIA RICE</div>
</div>

<!-- Login -->
<div id="loginScreen" class="hidden">
  <div class="login-card">
    <img src="assets/logo.png" alt="Kia Rice">
    <h1 id="loginTitle">ورود به سامانه مدیریت فروش برنج</h1>
    <p class="sub">پخش برنج کیارایس</p>
    <div class="field">
      <label>نام کاربری</label>
      <input id="loginUser" type="text" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="btn block" id="loginBtn">ورود</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-version">نسخه ۲.۰.۰</div>
  </div>
</div>

<!-- App -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <img src="assets/logo.png" alt="">
      <div><b>KIA RICE</b><span id="sidebarRole">—</span></div>
    </div>
    <div id="navList"></div>
    <div class="spacer"></div>
    <div class="nav-item logout" id="logoutBtn"><span class="ic">⎋</span> خروج از حساب</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="titleblock">
          <h2 id="pageTitle">داشبورد</h2>
          <span id="pageSubtitle"></span>
        </div>
      </div>
      <div class="right">
        <div class="bell" id="bellIcon">🔔<span class="dot hidden" id="bellDot"></span></div>
        <div class="clock" id="clockBox"></div>
      </div>
    </div>
    <div class="content">
      <div class="page" id="pageContent"></div>
    </div>
  </div>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script src="js/firebase.js"></script>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script src="js/marketer.js"></script>
</body>
</html>
