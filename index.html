:root{
  --bg: #0b0b0c;
  --bg2: #131315;
  --card: #17171a;
  --card2: #1d1d20;
  --gold: #cda349;
  --gold-bright: #e8c477;
  --gold-dim: #8a723a;
  --text: #f3ede0;
  --text-dim: #a9a297;
  --border: #2a2a2d;
  --green: #4caf7d;
  --red: #d16b6b;
  --blue: #6b9bd1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;}
body{min-height:100vh; overscroll-behavior-y: none;}
#root{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:10px;}

.bg-pattern{
  background-image: radial-gradient(circle at 20% 10%, rgba(205,163,73,0.06), transparent 40%), radial-gradient(circle at 90% 80%, rgba(205,163,73,0.05), transparent 40%);
}

a, button, input, select, textarea { font-family: inherit; }
button{cursor:pointer;}
input,select,textarea{
  background:var(--card2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:12px 14px; font-size:15px; width:100%; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim);}
input::placeholder,textarea::placeholder{color:#6b6a63;}
label{font-size:13px;color:var(--text-dim);margin-bottom:6px;display:block;}
.field{margin-bottom:14px;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));
  color:#151007; font-weight:700; border:none; border-radius:12px; padding:14px;
  font-size:15px; width:100%; box-shadow: 0 4px 20px rgba(205,163,73,0.18);
  transition: transform .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn.secondary{
  background:transparent; color:var(--gold); border:1px solid var(--gold-dim); box-shadow:none;
}
.btn.danger{background:linear-gradient(135deg,#e07a7a,#b64f4f); color:#fff; box-shadow:none;}
.btn.small{padding:9px 14px;font-size:13px;border-radius:9px;width:auto;}
.btn:disabled{opacity:0.5;}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px;
}
.card.tight{padding:12px;}
.chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);
  color:var(--text-dim); font-size:12px; padding:4px 10px; border-radius:20px;
}
.chip.gold{color:var(--gold-bright);border-color:var(--gold-dim);}
.chip.green{color:var(--green);border-color:#2b4f3c;}
.chip.red{color:var(--red);border-color:#4f2b2b;}

.section-title{font-size:14px;color:var(--gold-bright);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title .line{flex:1;height:1px;background:linear-gradient(to left,var(--border),transparent);}

.header{
  position:sticky; top:0; z-index:20; background:rgba(11,11,12,0.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
}
.header h1{font-size:16px;margin:0;color:var(--gold-bright);font-weight:700;}
.header .sub{font-size:11px;color:var(--text-dim);}

.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:rgba(19,19,21,0.97); backdrop-filter:blur(10px); border-top:1px solid var(--border);
  display:flex; z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1; background:none; border:none; color:var(--text-dim); display:flex; flex-direction:column; align-items:center;
  gap:3px; font-size:10px; padding:6px 2px; border-radius:10px;
}
.tabbar button.active{color:var(--gold-bright);}
.tabbar svg{width:20px;height:20px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat-box .num{font-size:20px;font-weight:800;color:var(--gold-bright);}
.stat-box .label{font-size:11px;color:var(--text-dim);margin-top:4px;}

.row{display:flex;align-items:center;justify-content:space-between;}
.row.gap{gap:10px;}

.product-card{
  background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:14px;
}
.product-card img{width:100%;height:170px;object-fit:cover;display:block;background:var(--card2);}
.product-card .noimg{width:100%;height:120px;display:flex;align-items:center;justify-content:center;color:#5c584e;font-size:12px;background:repeating-linear-gradient(45deg,#161618,#161618 10px,#19191c 10px,#19191c 20px);}
.product-card .body{padding:14px;}
.product-card .name{font-size:16px;font-weight:800;color:var(--text);}
.product-card .origin{font-size:12px;color:var(--gold-dim);margin-top:2px;}
.spec-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;}
.spec-table td{padding:6px 4px;border-bottom:1px solid var(--border);color:var(--text-dim);}
.spec-table td:first-child{color:var(--text);text-align:left;font-weight:600;}
.dots{letter-spacing:2px;color:var(--gold);}
.dots .off{color:#3a3934;}
.price-box{display:flex;justify-content:space-between;background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:10px;}
.price-box .p{text-align:center;}
.price-box .p .v{font-weight:800;font-size:14px;color:var(--text);}
.price-box .p.coop .v{color:var(--gold-bright);}
.price-box .p .l{font-size:10px;color:var(--text-dim);margin-top:2px;}
.pitch{background:rgba(205,163,73,0.08); border-right:3px solid var(--gold); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:12.5px; color:#d9cdae; line-height:1.9;}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 26px;}
.login-logo{width:130px;height:auto;margin-bottom:6px;filter: drop-shadow(0 0 20px rgba(205,163,73,0.25));}
.login-title{font-size:13px;color:var(--text-dim);margin-bottom:34px;letter-spacing:1px;}
.login-card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:16px;}

.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold-bright),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-weight:800;color:#151007;font-size:14px;}

.empty{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px;}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:0.6;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal{width:100%;max-width:520px;background:var(--bg2);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;padding:20px 18px 30px;border-top:1px solid var(--border);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px;}

.pill-toggle{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;}
.pill-toggle button{flex:1;background:none;border:none;color:var(--text-dim);padding:10px;border-radius:9px;font-size:13px;font-weight:600;}
.pill-toggle button.active{background:var(--gold);color:#151007;}

.route-stop{display:flex;gap:12px;margin-bottom:4px;}
.route-stop .timeline{display:flex;flex-direction:column;align-items:center;width:20px;}
.route-stop .dot{width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--gold-dim);flex-shrink:0;}
.route-stop .dot.done{background:var(--gold);border-color:var(--gold);}
.route-stop .bar{width:2px;flex:1;background:var(--border);margin:2px 0;}
.route-stop .content{flex:1;padding-bottom:20px;}

.rate-abc{display:flex;gap:6px;}
.rate-abc button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text-dim);font-weight:700;}
.rate-abc button.active{background:var(--gold);color:#151007;border-color:var(--gold);}

.chat-bubble{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.9;margin-bottom:10px;white-space:pre-wrap;}
.chat-bubble.user{background:var(--gold);color:#151007;margin-right:auto;border-bottom-right-radius:4px;}
.chat-bubble.ai{background:var(--card2);color:var(--text);margin-left:auto;border-bottom-left-radius:4px;border:1px solid var(--border);}
.chat-input-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0;background:var(--bg);}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold-dim);color:var(--text);padding:10px 18px;border-radius:30px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.4);}

.badge-role{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--gold-dim);border:1px solid var(--border);}

.spinner{width:16px;height:16px;border:2px solid rgba(21,16,7,0.3);border-top-color:#151007;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner.light{border:2px solid rgba(243,237,224,0.2);border-top-color:var(--gold-bright);}

.tab-switch-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;}
.tab-switch-row::-webkit-scrollbar{display:none;}
.tab-switch-row button{white-space:nowrap;background:var(--card2);border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:20px;font-size:12.5px;}
.tab-switch-row button.active{background:var(--gold);color:#151007;border-color:var(--gold);font-weight:700;}

.center-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;}
</style>
</head>

// ---------- Firestore via REST API (no external SDK needed) ----------
const FIRESTORE_PROJECT_ID = "kiarice";
const FIRESTORE_DOC_URL = "https://firestore.googleapis.com/v1/projects/" + FIRESTORE_PROJECT_ID + "/databases/(default)/documents/appdata/main";

window.fbGetAppData = async function(){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(FIRESTORE_DOC_URL, {signal: ctrl.signal});
    clearTimeout(t);
    if(res.status === 404) return null;
    if(!res.ok) throw new Error('Firestore GET failed: ' + res.status);
    const json = await res.json();
    if(!json.fields || !json.fields.json || typeof json.fields.json.stringValue !== 'string') return null;
    return JSON.parse(json.fields.json.stringValue);
  }catch(e){
    clearTimeout(t);
    throw e;
  }
};

window.fbSetAppData = async function(data){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);
  const body = { fields: { json: { stringValue: JSON.stringify(data) } } };
  try{
    const res = await fetch(FIRESTORE_DOC_URL, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if(!res.ok) throw new Error('Firestore PATCH failed: ' + res.status);
    return true;
  }catch(e){
    clearTimeout(t);
    throw e;
  }
};

window.__fbReady = true;

async function fbSetWithRetry(data, attempt){

// ---------- Persistence ----------
// All shared org data lives in ONE Firestore document to keep this simple
// and avoid write conflicts across multiple screens.
async function loadAll(){
  await waitForStorage(6000);
  let data = null;
  try{ data = await window.fbGetAppData(); }
  catch(e){ console.error('firestore get failed', e); }

  if(!data){
    data = { users: SEED_USERS, products: SEED_PRODUCTS, customers: [], routes: {}, messages: [] };
    await fbSetWithRetry(data);
  }
  state.users = data.users || SEED_USERS;
  state.products = data.products || SEED_PRODUCTS;
  state.customers = data.customers || [];
  state.routes = data.routes || {};
  state.messages = data.messages || [];

  try{
    const session = JSON.parse(localStorage.getItem('kiarice_session') || 'null');
    if(session){
      const u = state.users.find(x=>x.username===session.username);
      if(u) state.user = u;
    }
  }catch(e){}
}

async function saveAll(){
  return fbSetWithRetry({
    users: state.users,
    products: state.products,
    customers: state.customers,
    routes: state.routes,
    messages: state.messages || []
  });
}
async function saveUsers(){ await saveAll(); }
async function saveProducts(){ await saveAll(); }
async function saveCustomers(){ await saveAll(); }
async function saveRoutes(){ await saveAll(); }
async function saveMessages(){ await saveAll(); }

async function doLogin(){
  const u = document.getElementById('lg-user').value.trim();
  const p = document.getElementById('lg-pass').value;
  const err = document.getElementById('lg-err');
  const found = state.users.find(x=>x.username===u && x.password===p);
  if(!found){ err.textContent = 'نام کاربری یا رمز عبور اشتباه است.'; return; }
  state.user = found;
  try{ localStorage.setItem('kiarice_session', JSON.stringify({username: found.username})); }catch(e){}
  state.adminTab = 'stats'; state.marketerTab = 'route';
  render();
}

async function doLogout(){
  state.user = null;
  try{ localStorage.removeItem('kiarice_session'); }catch(e){}
  render();
}

function marketers(){ return state.users.filter(u=>u.role==='marketer'); }

function computeMarketerStats(username, period){
  // period: 'day' | 'month'
  const now = new Date();
  const ym = now.toISOString().slice(0,7);
  const today = todayStr();
  let totalKg=0, totalRevenue=0, visitCount=0, purchaseCount=0, noPurchaseCount=0;
  const reasons = {};
  state.customers.forEach(c=>{
    (c.visits||[]).forEach(v=>{
      if(v.marketer !== username) return;
      if(period==='day' && v.date !== today) return;
      if(period==='month' && !v.date.startsWith(ym)) return;
      visitCount++;
      if(v.purchased){
        purchaseCount++;
        (v.items||[]).forEach(it=>{ totalKg += Number(it.weightKg||0); totalRevenue += Number(it.totalPrice||0); });
      } else {
        noPurchaseCount++;
        const r = v.noPurchaseReason || 'نامشخص';
        reasons[r] = (reasons[r]||0)+1;
      }
    });
  });
  return {totalKg, totalRevenue, visitCount, purchaseCount, noPurchaseCount, reasons};
}

function computeCommission(totalKg, totalRevenue){
  if(totalKg<=0) return 0;
  const TIER_KG = 5000; // 5 tons
  if(totalKg<=TIER_KG) return totalRevenue*0.02;
  const avgPrice = totalRevenue/totalKg;
  const under = TIER_KG*avgPrice*0.02;
  const over = (totalKg-TIER_KG)*avgPrice*0.03;
  return under+over;
}

async function deleteMarketer(username){
  if(!confirm('حذف این بازاریاب مطمئن هستید؟')) return;
  state.users = state.users.filter(u=>u.username!==username);
  await saveUsers();
  showToast('بازاریاب حذف شد.');
  render();
}

function openRouteEditor(username){
  const date = todayStr();
  if(!state.routes[username]) state.routes[username] = {};
  if(!state.routes[username][date]) state.routes[username][date] = [];
  const stops = state.routes[username][date];

  const modal = el(`<div class="modal-bg"><div class="modal">
    <div class="modal-handle"></div>
    <h2 style="margin:0 0 4px;font-size:17px;">تنظیم مسیر امروز</h2>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">${date}</div>
    <div id="stops-list"></div>
    <div class="field"><label>عنوان توقف (مثلاً: خیابان امام)</label><input id="stop-title"/></div>
    <div class="field"><label>یادداشت (اختیاری)</label><input id="stop-note" placeholder="مثلاً از ساعت ۹"/></div>
    <button class="btn secondary" id="add-stop">+ افزودن توقف</button>
    <button class="btn" id="route-close" style="margin-top:14px;">تمام و ذخیره</button>
  </div></div>`);
  document.body.appendChild(modal);

  function drawStops(){
    const box = modal.querySelector('#stops-list');
    if(stops.length===0){ box.innerHTML = `<div class="empty" style="padding:20px;">هنوز توقفی اضافه نشده.</div>`; return; }
    box.innerHTML = stops.map((s,i)=>`
      <div class="card tight" style="margin-bottom:8px;">
        <div class="row"><b>${i+1}. ${s.title}</b><button class="btn small danger" data-i="${i}">حذف</button></div>
        ${s.note?`<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">${s.note}</div>`:''}
      </div>`).join('');
    box.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ stops.splice(Number(b.dataset.i),1); drawStops(); };
    });
  }
  drawStops();

  modal.querySelector('#add-stop').onclick = ()=>{
    const title = modal.querySelector('#stop-title').value.trim();
    const note = modal.querySelector('#stop-note').value.trim();
    if(!title) return;
    stops.push({id:uid(), title, note, done:false});
    modal.querySelector('#stop-title').value='';
    modal.querySelector('#stop-note').value='';
    drawStops();
  };
  modal.querySelector('#route-close').onclick = async ()=>{
    await saveRoutes();
    modal.remove();
    showToast('مسیر ذخیره شد.');
  };
}

function renderMarketerRoute(content){
  const date = todayStr();
  const stops = (state.routes[state.user.username] && state.routes[state.user.username][date]) || [];
  const s = computeMarketerStats(state.user.username, 'month');
  const sd = computeMarketerStats(state.user.username, 'day');
  const commission = computeCommission(s.totalKg, s.totalRevenue);

  content.innerHTML = `
    <div class="stat-grid" style="margin-bottom:10px;">
      <div class="stat-box"><div class="num">${toman(sd.totalKg)}</div><div class="label">کیلو فروش امروز</div></div>
      <div class="stat-box"><div class="num">${toman(sd.totalRevenue)}</div><div class="label">فروش امروز (ت)</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:18px;">
      <div class="stat-box"><div class="num">${toman(s.totalKg)}</div><div class="label">کیلو فروش این ماه</div></div>
      <div class="stat-box"><div class="num">${toman(Math.round(commission))}</div><div class="label">پورسانت تخمینی (ت)</div></div>
    </div>
    <div class="section-title"><span>مسیر امروز</span><span class="line"></span></div>
    <div id="route-list"></div>
    <button class="btn secondary" id="logout-btn-m" style="margin-top:24px;">خروج از حساب</button>
  `;
  const rl = document.getElementById('route-list');
  if(stops.length===0){
    rl.innerHTML = `<div class="empty"><div class="ic">🗺️</div>مدیر هنوز مسیری برای امروز تعریف نکرده.</div>`;
  } else {
    rl.innerHTML = stops.map((s,i)=>`
      <div class="route-stop">
        <div class="timeline">
          <div class="dot ${s.done?'done':''}"></div>
          ${i<stops.length-1?'<div class="bar"></div>':''}
        </div>
        <div class="content">
          <div class="card tight">
            <div class="row"><b>${s.title}</b>
              <button class="btn small ${s.done?'secondary':''}" data-i="${i}">${s.done?'✓ انجام شد':'علامت‌گذاری'}</button>
            </div>
            ${s.note?`<div style="font-size:12px;color:var(--text-dim);margin-top:6px;">${s.note}</div>`:''}
          </div>
        </div>
      </div>
    `).join('');
    rl.querySelectorAll('button').forEach(b=>{
      b.onclick = async ()=>{
        stops[Number(b.dataset.i)].done = !stops[Number(b.dataset.i)].done;
        await saveRoutes();
        renderMarketerRoute(content);
      };
    });
  }
  document.getElementById('logout-btn-m').onclick = doLogout;
}

function starsHtml(val, max){
  max = max||5;
  let s = '';
  for(let i=0;i<max;i++) s += i<val ? '●' : '<span class="off">○</span>';
  return `<span class="dots">${s}</span>`;
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h>maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderMarketerCustomers(content){

    <div id="mc-list"></div>
  `;
  const list = document.getElementById('mc-list');
  function draw(){
    const q = document.getElementById('mc-search').value.trim();
    const items = mine.filter(c=> !q || (c.shopName+c.city).includes(q));
    if(items.length===0){ list.innerHTML = `<div class="empty"><div class="ic">📁</div>هنوز مشتری‌ای ثبت نکردید.</div>`; return; }
    list.innerHTML = items.slice().reverse().map(c=>`
      <div class="card tight" style="margin-bottom:10px;">
        <div class="row"><b>${c.shopName}</b><span class="chip gold">${c.rating||'—'}</span></div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:6px;">${c.city||''} · ${(c.visits||[]).length} مراجعه</div>

      </div>

  draw();
}

function renderMarketerMessages(content){
  if(!state.messages) state.messages = [];
  const mine = state.messages.filter(m=>m.to==='all' || m.to===state.user.username).slice().reverse();
  content.innerHTML = `
    <div class="section-title" style="margin-top:0;"><span>پیام‌ها و ماموریت‌های مدیر</span><span class="line"></span></div>
    <div id="msg-list"></div>
  `;
  const list = document.getElementById('msg-list');
  function draw(){
    if(mine.length===0){ list.innerHTML = `<div class="empty"><div class="ic">📨</div>هنوز پیامی برای شما ارسال نشده.</div>`; return; }
    list.innerHTML = mine.map(m=>{
      const done = (m.doneBy||[]).includes(state.user.username);
      return `<div class="card tight" style="margin-bottom:10px;">
        <div class="row"><span class="chip ${m.type==='mission'?'gold':''}">${m.type==='mission'?'🎯 ماموریت':'💬 پیام'}</span><span style="font-size:11px;color:var(--text-dim);">${m.date}</span></div>
        <div style="margin-top:8px;font-size:13.5px;">${m.text}</div>
        ${m.type==='mission' ? `<button class="btn small ${done?'secondary':''}" data-id="${m.id}" style="margin-top:10px;">${done?'✓ انجام شد':'علامت به‌عنوان انجام‌شده'}</button>` : ''}
      </div>`;
    }).join('');
    list.querySelectorAll('button').forEach(b=>{
      b.onclick = async ()=>{
        const msg = state.messages.find(x=>x.id===b.dataset.id);
        if(!msg.doneBy) msg.doneBy = [];
        const i = msg.doneBy.indexOf(state.user.username);
        if(i===-1) msg.doneBy.push(state.user.username); else msg.doneBy.splice(i,1);
        await saveMessages();
        draw();
      };
    });
  }
  draw();
}
